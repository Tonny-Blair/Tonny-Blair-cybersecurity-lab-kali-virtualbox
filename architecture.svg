<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Lab architecture</title>
  <desc id="d">An Ubuntu host running VirtualBox. Inside it, a NAT Network 10.0.0.0/24 connects a Kali Linux VM at 10.0.0.2, space for future target VMs, and a virtual gateway at 10.0.0.1 that provides outbound internet access.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#14123a"/></linearGradient>
    <linearGradient id="hostStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <linearGradient id="kali" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1c07"/><stop offset="1" stop-color="#241006"/></linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2c4a"/><stop offset="1" stop-color="#0a1c33"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 7 6; animation: dash 1.1s linear infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
  </style>

  <rect width="960" height="470" rx="16" fill="url(#bg)"/>
  <rect width="960" height="470" rx="16" fill="url(#grid)"/>
  <text x="30" y="36" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">LAB ARCHITECTURE</text>

  <!-- Host -->
  <rect x="30" y="56" width="700" height="370" rx="16" fill="#101a31" stroke="url(#hostStroke)" stroke-width="1.5"/>
  <g transform="translate(50 70) scale(1.0833333333333333)" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><line x1="7" y1="6.5" x2="7.01" y2="6.5"/><line x1="7" y1="17.5" x2="7.01" y2="17.5"/></g>
  <text x="86" y="88" font-size="15" font-weight="700" fill="#e2e8f0">Host: Ubuntu 26.04.1 LTS</text>
  <text x="86" y="106" font-size="12.5" fill="#94a3b8">Intel Core i5-10210U · 7 GB RAM · VirtualBox 7.2.6</text>

  <!-- NAT Network -->
  <rect x="56" y="124" width="648" height="282" rx="14" fill="#0a2a2c" fill-opacity=".85" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="3 0"/>
  <text x="76" y="150" font-size="14" font-weight="700" fill="#5eead4">NAT Network “NatNetwork”</text>
  <text x="76" y="168" font-size="12" fill="#94a3b8">10.0.0.0/24 · DHCP enabled · IPv6 disabled</text>

  <!-- Kali -->
  <g filter="url(#sh)">
    <rect x="84" y="190" width="210" height="124" rx="12" fill="url(#kali)" stroke="#fb923c" stroke-width="2"/>
  </g>
  <g transform="translate(177 198) scale(1.0)" fill="none" stroke="#fdba74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></g>
  <text x="189" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#fed7aa">Kali Linux 2026.3</text>
  <text x="189" y="265" text-anchor="middle" font-size="14" fill="#fdba74">10.0.0.2/24 (static)</text>
  <text x="189" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">2 vCPU · 2048 MB RAM</text>
  <text x="189" y="301" text-anchor="middle" font-size="12" fill="#94a3b8">eth0 · Intel PRO/1000 MT</text>

  <!-- Future targets -->
  <rect x="320" y="190" width="180" height="124" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g transform="translate(398 198) scale(1.0)" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></g>
  <text x="410" y="244" text-anchor="middle" font-size="14" fill="#cbd5e1">Future target VMs</text>
  <text x="410" y="265" text-anchor="middle" font-size="12.5" fill="#94a3b8">10.0.0.x</text>
  <text x="410" y="285" text-anchor="middle" font-size="12" fill="#64748b">(to be added)</text>

  <!-- Gateway -->
  <g filter="url(#sh)">
    <rect x="526" y="190" width="150" height="124" rx="12" fill="url(#gw)" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <g transform="translate(589 198) scale(1.0)" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
  <text x="601" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#bae6fd">Virtual gateway</text>
  <text x="601" y="266" text-anchor="middle" font-size="14" fill="#7dd3fc">10.0.0.1</text>
  <text x="601" y="286" text-anchor="middle" font-size="12" fill="#94a3b8">NAT + DHCP</text>

  <!-- Virtual switch -->
  <g stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)">
    <line class="flow" x1="189" y1="346" x2="601" y2="346"/>
    <line class="flow" x1="189" y1="314" x2="189" y2="346"/>
    <line class="flow" x1="410" y1="314" x2="410" y2="346" opacity=".5"/>
    <line class="flow" x1="601" y1="314" x2="601" y2="346"/>
  </g>
  <rect x="300" y="362" width="190" height="24" rx="12" fill="#0f766e" fill-opacity=".35" stroke="#2dd4bf" stroke-opacity=".5"/>
  <text x="395" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#99f6e4">Virtual switch · one shared subnet</text>

  <!-- Internet -->
  <line class="flow" x1="676" y1="252" x2="768" y2="252" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#sh)">
    <ellipse cx="858" cy="252" rx="84" ry="62" fill="#152036" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <g transform="translate(845 215) scale(1.0833333333333333)" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></g>
  <text x="858" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">Internet</text>
  <text x="858" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">DNS 8.8.8.8</text>
  <text x="858" y="338" text-anchor="middle" font-size="11.5" fill="#94a3b8">outbound only, via NAT</text>

  <text x="30" y="454" font-size="11.5" fill="#64748b">Lab VMs can reach the internet through the gateway. Nothing outside can reach them unless port forwarding is added.</text>
</svg>
