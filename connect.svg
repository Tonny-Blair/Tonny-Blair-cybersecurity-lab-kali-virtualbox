<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Connect with Karibwende Blair on LinkedIn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#14123a"/></linearGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <clipPath id="c"><rect width="900" height="200" rx="18"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0A66C2" flood-opacity=".5"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    .n { animation: pulse 2.8s ease-in-out infinite; }
  </style>
  <g clip-path="url(#c)">
    <rect width="900" height="200" fill="url(#bg)"/>
    <rect y="190" width="900" height="10" fill="url(#bar)"/>
    <g stroke="#2dd4bf" stroke-opacity=".25" stroke-width="1.2">
      <line x1="640" y1="50" x2="720" y2="110"/><line x1="720" y1="110" x2="800" y2="60"/><line x1="720" y1="110" x2="780" y2="160"/>
      <line x1="800" y1="60" x2="860" y2="120"/><line x1="780" y1="160" x2="860" y2="120"/><line x1="640" y1="50" x2="700" y2="30"/>
    </g>
    <g fill="#5eead4">
      <circle class="n" cx="640" cy="50" r="4"/><circle class="n" cx="720" cy="110" r="6" style="animation-delay:.6s"/>
      <circle class="n" cx="800" cy="60" r="4" style="animation-delay:1.2s"/><circle class="n" cx="780" cy="160" r="4" style="animation-delay:1.8s"/>
      <circle class="n" cx="860" cy="120" r="5" style="animation-delay:.3s"/><circle class="n" cx="700" cy="30" r="3" style="animation-delay:2.2s"/>
    </g>
  </g>
  <circle cx="100" cy="92" r="52" fill="url(#av)"/>
  <circle cx="100" cy="92" r="52" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
  <text x="100" y="108" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">KB</text>
  <text x="180" y="74" font-size="30" font-weight="800" fill="#f8fafc">Karibwende Blair</text>
  <text x="180" y="100" font-size="14.5" fill="#94a3b8">Building hands-on cybersecurity skills, one lab at a time.</text>
  <g filter="url(#sh)">
    <rect x="180" y="118" width="268" height="46" rx="23" fill="#0A66C2"/>
  </g>
  <rect x="196" y="129" width="24" height="24" rx="5" fill="#ffffff"/>
  <text x="208" y="147.5" text-anchor="middle" font-size="16" font-weight="800" fill="#0A66C2">in</text>
  <text x="232" y="147" font-size="16" font-weight="700" fill="#ffffff">Connect on LinkedIn</text>
</svg>
