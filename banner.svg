<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Cybersecurity Lab: isolated Kali Linux environment" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset=".55" stop-color="#12123a"/><stop offset="1" stop-color="#052a2b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#7dd3fc"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="glowT"><stop offset="0" stop-color="#14b8a6" stop-opacity=".38"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .l { animation: reveal .45s ease-out both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="200" cy="40" r="300" fill="url(#glowT)"/>
    <circle cx="1120" cy="330" r="340" fill="url(#glowP)"/>
    <rect y="350" width="1200" height="10" fill="url(#bar)"/>
  </g>

  <!-- left: title block -->
  <rect x="60" y="56" width="236" height="32" rx="16" fill="#14b8a6" fill-opacity=".14" stroke="#2dd4bf" stroke-opacity=".6"/>
  <g transform="translate(72 62) scale(0.8333333333333334)" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></g>
  <text x="100" y="77" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#99f6e4">HANDS-ON SECURITY LAB</text>

  <text x="58" y="158" font-size="54" font-weight="800" fill="url(#title)">Cybersecurity Lab</text>
  <text x="60" y="206" font-size="30" font-weight="600" fill="#e2e8f0">Isolated Kali Linux Environment</text>
  <text x="60" y="240" font-size="17" fill="#94a3b8">VirtualBox  ·  NAT Network  ·  Static addressing  ·  Layered verification</text>

  <g font-size="14" font-weight="600" text-anchor="middle" fill="#e2e8f0">
    <rect x="60" y="272" width="122" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="121" y="294">Ubuntu 26.04</text>
    <rect x="194" y="272" width="150" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="269" y="294">VirtualBox 7.2.6</text>
    <rect x="356" y="272" width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="415" y="294">Kali 2026.3</text>
    <rect x="486" y="272" width="122" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="547" y="294">10.0.0.0/24</text>
  </g>

  <!-- right: terminal -->
  <g filter="url(#shadow)">
    <rect x="690" y="52" width="470" height="256" rx="14" fill="#0a1020" stroke="#2a3a5c"/>
    <path d="M690 66a14 14 0 0 1 14-14h442a14 14 0 0 1 14 14v22H690z" fill="#121c33"/>
  </g>
  <circle cx="712" cy="70" r="6" fill="#ff5f56"/><circle cx="732" cy="70" r="6" fill="#ffbd2e"/><circle cx="752" cy="70" r="6" fill="#27c93f"/>
  <text x="925" y="75" text-anchor="middle" font-size="12.5" fill="#64748b">kali@kali: ~</text>
  <g class="mono" font-size="13.5">
    <g class="l" style="animation-delay:.4s"><text class="mono" x="712" y="116" fill="#2dd4bf">$ <tspan fill="#e2e8f0">ip a</tspan></text></g>
    <g class="l" style="animation-delay:.9s"><text class="mono" x="712" y="140" fill="#7dd3fc">inet 10.0.0.2/24 ... eth0</text></g>
    <g class="l" style="animation-delay:1.5s"><text class="mono" x="712" y="172" fill="#2dd4bf">$ <tspan fill="#e2e8f0">ping -c 3 10.0.0.1</tspan></text></g>
    <g class="l" style="animation-delay:2s"><text class="mono" x="712" y="196" fill="#86efac">3 packets transmitted, 3 received, 0% packet loss</text></g>
    <g class="l" style="animation-delay:2.6s"><text class="mono" x="712" y="228" fill="#2dd4bf">$ <tspan fill="#e2e8f0">nmap --version</tspan></text></g>
    <g class="l" style="animation-delay:3.1s"><text class="mono" x="712" y="252" fill="#7dd3fc">Nmap version 7.99 ( https://nmap.org )</text></g>
    <g class="l" style="animation-delay:3.6s"><text class="mono" x="712" y="284" fill="#2dd4bf">$</text></g>
  </g>
  <rect class="cursor" x="728" y="272" width="9" height="16" fill="#e2e8f0"/>

  <!-- decorative nodes -->
  <g fill="#5eead4">
    <circle class="dot" cx="1010" cy="30" r="3"/><circle class="dot" cx="1060" cy="24" r="2" style="animation-delay:.8s"/>
    <circle class="dot" cx="650" cy="40" r="2.5" style="animation-delay:1.4s"/><circle class="dot" cx="1176" cy="120" r="2.5" style="animation-delay:.4s"/>
  </g>
</svg>
